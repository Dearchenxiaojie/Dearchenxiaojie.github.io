    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        serif: ['Noto+Serif+SC', 'Georgia', 'serif'],
                    },
                    colors: {
                        primary: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
                        accent: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' },
                        warm: { 50:'#fdf8f0',100:'#f5e6d3',200:'#e8cba7',300:'#d4a574',400:'#c9a88c',500:'#b8956a',600:'#a07d52',700:'#8b6b42',800:'#6d5434',900:'#4a3a24' }

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }

        /* 导航毛玻璃 */
        .nav-glass {
            background: rgba(253, 248, 240, 0.9);
            backdrop-filter: blur(12px);
        }
        .dark .nav-glass {
            background: rgba(15, 23, 42, 0.9);
        }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #c9a88c 0%, #8b6b42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 卡片 */
        .card-warm {
            background: white;
            border: 1px solid #f5e6d3;
            border-radius: 16px;
            transition: all 0.3s;
        }
        .card-warm:hover {
            box-shadow: 0 12px 24px -8px rgba(201, 168, 140, 0.2);
        }
        .dark .card-warm {
            background: #1e293b;
            border-color: #334155;
        }

        /* 编辑器 */
        .editor-area {
            width: 100%;
            min-height: 400px;
            padding: 24px;
            border: 1px solid #f5e6d3;
            border-radius: 12px;
            font-family: 'Noto Serif SC', Georgia, serif;
            font-size: 16px;
            line-height: 2;
            color: #4a3a24;
            background: #fdf8f0;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        .editor-area:focus {
            border-color: #c9a88c;
        }
        .dark .editor-area {
            background: #0f172a;
            border-color: #334155;
            color: #e2e8f0;
        }
        .dark .editor-area:focus {
            border-color: #8b6b42;
        }

        /* 按钮 */
        .btn-warm {
            background: linear-gradient(135deg, #c9a88c 0%, #8b6b42 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-warm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(201, 168, 140, 0.4);
        }
        .btn-warm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-outline {
            background: transparent;
            color: #8b6b42;
            border: 1px solid #e8cba7;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background: #fdf8f0;
            border-color: #c9a88c;
        }
        .dark .btn-outline {
            color: #d4a574;
            border-color: #475569;
        }
        .dark .btn-outline:hover {
            background: #1e293b;
            border-color: #8b6b42;
        }

        /* 版本列表 */
        .version-item {
            padding: 16px;
            border: 1px solid #f5e6d3;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .version-item:hover {
            background: #fdf8f0;
            border-color: #c9a88c;
        }
        .dark .version-item {
            border-color: #334155;
        }
        .dark .version-item:hover {
            background: #1e293b;
            border-color: #8b6b42;
        }

        /* 标签选择 */
        .choice {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid #e8cba7;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: #6d5434;
        }
        .choice:hover {
            border-color: #c9a88c;
            background: #fdf8f0;
        }
        .choice.active {
            background: linear-gradient(135deg, #c9a88c 0%, #8b6b42 100%);
            color: white;
            border-color: transparent;
        }
        .dark .choice {
            border-color: #475569;
            color: #d4a574;
        }
        .dark .choice:hover {
            border-color: #8b6b42;
            background: #1e293b;
        }
        .dark .choice.active {
            background: linear-gradient(135deg, #8b6b42 0%, #6d5434 100%);
            color: white;
        }

        /* 加载动画 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #f5e6d3;
            border-top-color: #c9a88c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* 打字效果 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: #c9a88c;
        }
    </style>
</head>

    <script>
        // 暗黑模式
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        // 移动端菜单
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // ===== 故事续写功能 =====

        // 版本存储
        let versions = JSON.parse(localStorage.getItem('story_versions') || '[]');

        // 初始化编辑器
        const editor = document.getElementById('story-editor');
        const wordCount = document.getElementById('word-count');

        // 字数统计
        editor.addEventListener('input', () => {
            const count = editor.value.length;
            wordCount.textContent = count.toLocaleString();
            // 自动保存到 localStorage
            localStorage.setItem('story_content', editor.value);
        });

        // 加载保存的内容
        const savedContent = localStorage.getItem('story_content');
        if (savedContent) {
            editor.value = savedContent;
            wordCount.textContent = savedContent.length.toLocaleString();
        }

        // 加载保存的设置
        const savedSettings = JSON.parse(localStorage.getItem('story_settings') || '{}');
        if (savedSettings.charName) document.getElementById('char-name').value = savedSettings.charName;
        if (savedSettings.storyType) document.getElementById('story-type').value = savedSettings.storyType;
        if (savedSettings.extraInfo) document.getElementById('extra-info').value = savedSettings.extraInfo;

        // 选择故事背景
        function selectChoice(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.choice').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        // 保存设置
        ['char-name', 'story-type', 'extra-info'].forEach(id => {
            document.getElementById(id).addEventListener('change', saveSettings);
            document.getElementById(id).addEventListener('input', saveSettings);
        });

        function saveSettings() {
            const settings = {
                charName: document.getElementById('char-name').value,
                storyType: document.getElementById('story-type').value,
                extraInfo: document.getElementById('extra-info').value,
                background: document.querySelector('.choice.active')?.dataset.value || '现代'
            };
            localStorage.setItem('story_settings', JSON.stringify(settings));
        }

        // 保存版本
        function saveVersion() {
            const content = editor.value.trim();
            if (!content) {
                showToast('内容为空', 'error');
                return;
            }

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            versions.unshift({
                time: timeStr,
                preview: content.substring(0, 50) + '...',
                full: content,
                wordCount: content.length
            });

            // 最多保存 20 个版本
            if (versions.length > 20) {
                versions = versions.slice(0, 20);
            }

            localStorage.setItem('story_versions', JSON.stringify(versions));
            renderVersions();
            showToast('版本已保存', 'success');
        }

        // 复制内容
        function copyContent() {
            const content = editor.value.trim();
            if (!content) {
                showToast('内容为空', 'error');
                return;
            }

            navigator.clipboard.writeText(content).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                // fallback
                const textarea = document.createElement('textarea');
                textarea.value = content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板', 'success');
            });
        }

        // 清空编辑器
        function clearEditor() {
            if (editor.value.trim() && !confirm('确定要清空所有内容吗？')) {
                return;
            }
            editor.value = '';
            wordCount.textContent = '0';
            localStorage.removeItem('story_content');
        }

        // 加载版本
        function loadVersion(index) {
            const ver = versions[index];
            if (!ver) return;

            if (editor.value.trim() && !confirm('当前内容将被替换，确定要加载此版本吗？')) {
                return;
            }

            editor.value = ver.full;
            wordCount.textContent = ver.full.length.toLocaleString();
            localStorage.setItem('story_content', ver.full);
            showToast('已加载版本: ' + ver.time, 'success');
        }

        // 删除版本
        function deleteVersion(index, event) {
            event.stopPropagation();
            if (!confirm('确定要删除此版本吗？')) return;

            versions.splice(index, 1);
            localStorage.setItem('story_versions', JSON.stringify(versions));
            renderVersions();
            showToast('版本已删除', 'success');
        }

        // 渲染版本列表
        function renderVersions() {
            const container = document.getElementById('version-list');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('version-count');

            countBadge.textContent = versions.length;

            if (versions.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = versions.map((ver, i) => `
                <div class="version-item" onclick="loadVersion(${i})">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-sm font-medium text-gray-900 dark:text-white">${ver.time}</span>
                                <span class="text-xs text-gray-500">${ver.wordCount} 字</span>
                            </div>
                            <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2">${ver.preview}</p>
                        </div>
                        <div class="flex items-center gap-2 ml-4">
                            <span class="px-3 py-1 text-xs bg-warm-100 dark:bg-warm-900/30 text-warm-600 dark:text-warm-400 rounded-lg">恢复</span>
                            <button onclick="deleteVersion(${i}, event)" class="px-2 py-1 text-xs text-gray-400 hover:text-red-500 transition-colors">✕</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Toast 提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
                padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 1000;
                background: ${type === 'success' ? '#22c55e' : '#ef4444'}; color: white;
                box-shadow: 0 8px 16px -4px rgba(0,0,0,0.2);
                animation: fadeInOut 2s ease-in-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // 初始化
        renderVersions();

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
                15% { opacity: 1; transform: translateX(-50%) translateY(0); }
                85% { opacity: 1; transform: translateX(-50%) translateY(0); }
                100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
